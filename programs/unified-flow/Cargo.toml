[package]
name = "unified-flow"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "unified_flow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Exposes internal helpers for native Rust unit-test coverage runs.
# Never enable in production builds.
test-utils = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
solana-program = "=2.2.1"

[dev-dependencies]
mollusk-svm = "0.5.1"
mollusk-svm-programs-token = "0.5.1"
solana-account = "2.2.1"
solana-instruction = "2.3.3"
solana-pubkey = "2.4.0"
spl-associated-token-account = "7.0.0"
spl-token = "8.0.0"
spl-token-2022 = "8.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
